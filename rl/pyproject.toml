[project]
name = "smat-rl"
version = "0.1.0"
description = "E3 original-slot factory layout optimization with PPO and a terminal transport LP"
requires-python = ">=3.10,<3.15"
dependencies = [
    "highspy==1.15.1",
    "numpy>=1.24",
    "scipy>=1.11",
    "torch==2.14.1; sys_platform == 'darwin'",
    "torch==2.5.1+cu121; sys_platform == 'linux'",
]

[project.optional-dependencies]
cuda = ["cupy-cuda12x>=13.3,<14; sys_platform == 'linux'"]
data = ["openpyxl>=3.1,<4"]

[tool.uv]
package = false
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64' and python_version >= '3.11'",
    "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version < '3.12'",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu121", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["smat_rl"]
